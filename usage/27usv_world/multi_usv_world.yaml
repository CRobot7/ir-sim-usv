# Five WAM-V USV14 boats in one shared irregular sea.
# Same world.wave, same t; wrenches differ only by hull pose.
# Waterjets stay at 0 N (control_mode: auto, no behavior).
world:
  height: 50
  width: 80
  step_time: 0.05
  sample_time: 0.05
  offset: [0, 0]
  control_mode: auto
  collision_mode: unobstructed
  wave:
    # Douglas sea state 2 (smooth), same as usv_world.yaml
    Hs: 0.20
    Tp: 5.0
    heading: 0.0
    n_freq: 20
    n_dir: 10
    seed: 0
  plot:
    grid: true
    grid_interval: 5    # metres; major ticks on the axes
    show_wave: true
    wave_cmap: ocean
    wave_alpha: 0.75
    wave_resolution: 1.0

robot:
  number: 5
  distribution: {name: manual}
  color: cycle
  kinematics:
    name: usv
    vessel: wamv
    payload: 0.0
    twj_max: 204.0    # per-jet thrust clip [N]; keep = vel_max
    xudot_frac: 0.16
  # Top-view from vessels/wamv.yaml (omit robot.shape).
  # Line along +x (wave heading) so each hull sees a different phase.
  state:
    - [12, 22, 0, 0, 0, 0]
    - [26, 22, 0, 0, 0, 0]
    - [40, 22, 0, 0, 0, 0]
    - [54, 22, 0, 0, 0, 0]
    - [68, 22, 0, 0, 0, 0]
  # Action is waterjet force [N], NOT velocity (vel_* is the generic clip API).
  vel_max: [204, 204]  # [T_port, T_stbd] max [N]
  vel_min: [0, 0]      # jets cannot reverse
  plot:
    show_sensor: false
    show_trajectory: true
    traj_width: 0.12
    traj_alpha: 0.85
    show_trail: false
    obj_fill: false
    obj_linewidth: 2.5
    show_goal: false
    show_arrow: true
    arrow_length: 3.0   # metres, body +x; color follows the hull
    show_text: true
