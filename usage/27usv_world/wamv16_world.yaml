# WAM-V 16 in IR-SIM (AC-IQN geometry / hydro / thrust box).
# Switch from usv_world.yaml by kinematics.vessel: wamv16.
# Larger catamaran (L=5.0, BOA=2.5) and reverse thrust allowed.
world:
  height: 50
  width: 80
  step_time: 0.05
  sample_time: 0.05
  offset: [0, 0]
  control_mode: keyboard
  collision_mode: stop
  wave:
    Hs: 0.20
    Tp: 5.0
    heading: 0.0
    n_freq: 20
    n_dir: 10
    seed: 0
  plot:
    viewpoint: robot_0
    grid: true
    grid_interval: 5
    show_wave: true
    wave_cmap: ocean
    wave_alpha: 0.75
    wave_resolution: 1.0

robot:
  kinematics:
    name: usv
    vessel: wamv16    # irsim/vessels/wamv16.yaml
  # Top-view from yaml hull.type: catamaran (omit robot.shape).
  state: [12, 12, 0, 0, 0, 0]
  goal: [60, 40, 0]
  vel_max: [1000, 1000]  # [T_port, T_stbd] max [N]
  vel_min: [-500, -500]  # astern allowed
  sensors:
    - name: lidar2d
      range_min: 0.2
      range_max: 20.0
      angle_range: 6.28318530718
      number: 180
      noise: false
      offset: [0, 0, 0]
      plot:
        alpha: 0.35
  plot:
    show_sensor: true
    show_trajectory: true
    traj_width: 0.12
    traj_alpha: 0.85
    show_trail: false
    obj_fill: false
    obj_linewidth: 2.5
    show_goal: true
    show_arrow: true
    arrow_length: 3.0

obstacle:
  - shape: {name: circle, radius: 1.5}
    state: [30, 20, 0]
  - shape: {name: circle, radius: 1.2}
    state: [45, 12, 0]
  - shape: {name: rectangle, length: 4.0, width: 1.5}
    state: [35, 35, 0.4]
  - shape: {name: circle, radius: 2.0}
    state: [55, 28, 0]

gui:
  keyboard:
    key_lv_max: 1000.0
    key_ang_max: 1000.0
    backend: mpl
